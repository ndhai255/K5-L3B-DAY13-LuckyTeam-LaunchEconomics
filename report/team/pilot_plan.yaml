# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu, MDE 5 điểm: 1.251 yêu cầu mỗi nhánh.
#   b) Theo nhân viên, m=75: DE=2,48; 3.103 yêu cầu mỗi nhánh; cần 42 nhân viên mỗi nhánh, không khả thi.
#   c) 20 nhân viên mỗi nhánh: tối đa 1.000 mẫu hiệu dụng, không đạt MDE 5 điểm.
#   d) 6 depot mỗi nhánh: tối đa 300 mẫu hiệu dụng.
#   e) Chấp nhận MDE 6 điểm: 20 staff x 299 yêu cầu = 5.980 yêu cầu thực tế mỗi nhánh;
#      DE=6,96, tương đương 859 mẫu hiệu dụng mỗi nhánh.
#
# D2 · Tách được tác động:
#   1. 20 staff đối chứng làm đồng thời, cùng depot với 20 staff can thiệp.
#   2. Phân tầng depot, bốc thăm bằng code và lưu seed trước khi mở pilot.
#   3. Giảm spillover bằng quyền theo staff_id và log agent_suggestion_shown.
#   4. Khóa chỉ số, ngưỡng, stop rule, seed và mốc T+37 trước ngày bắt đầu.
#   5. Có đúng 20 cụm staff mỗi nhánh.
#
# Baseline mở lại: toàn mẫu 51/1.200 = 4,25%; scope noi_dia + hang_nang 39/982 = 3,97%.
# Giới hạn event hiện tại: refund_ledger_write chỉ có request_id, idempotency_key,
# so_tien_hoan, ket_qua, trace_id; chưa có khóa đơn nghiệp vụ chung để phát hiện
# hai request_id khác nhau cho cùng một đơn. Đây là điều kiện phải bổ sung trước pilot.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "noi_dia + hang_nang; loại quoc_te và doi_tac. CPS A3 theo loại và CPS scope A4 đều là simulated."
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50] # 0.10 và 0.25 mỗi bước 1 tuần; 0.50 giữ tối thiểu 2 tuần đầy đủ.
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859 # cỡ mẫu hiệu dụng, không phải số yêu cầu thô
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 staff đối chứng làm đồng thời, cùng depot; arm giữ theo staff_id cho mọi yêu cầu đủ điều kiện."
    spillover_risk: "Có rủi ro chia sẻ trong depot; chặn quyền trợ lý theo staff_id và log agent_suggestion_shown."
    predeclared: "Khóa chỉ số, MDE, ngưỡng, stop rule, seed và T+37 trước ngày bắt đầu. Nếu thu hẹp scope, khóa và báo cáo riêng dữ liệu scope cũ; không gộp trước và sau thu hẹp để kết luận hiệu quả hay CPS, mà mở cohort noi_dia mới có đối chứng đồng thời và kế hoạch phân tích viết trước."
  stop_rules:
    - "NẾU refund_ledger_write có từ 2 kết quả ket_qua=ok với idempotency_key khác nhau cho cùng request_id TRONG bất kỳ lần đối soát thời gian thực nào THÌ Giám đốc vận hành hoàn tất tắt trợ lý và chuyển ca mới sang nhân viên trong 30 phút, đồng thời Kỹ sư trưởng agent đối soát sổ cái KHÔNG THÌ giữ trạng thái rollout hiện tại; chỉ mở rộng khi các luật dừng khác đạt."
    - "NẾU tỷ lệ mở lại 7 ngày của arm trợ lý cao hơn đối chứng từ 2 điểm phần trăm hoặc vượt 6 phần trăm TRONG một lần kiểm tra có dữ liệu theo dõi đủ 7 ngày THÌ Giám đốc vận hành dừng mở rộng và chuyển ca mới sang luồng nhân viên KHÔNG THÌ chỉ chuyển bước sau khi cửa sổ kiểm tra hoàn tất, không có vi phạm hoàn trùng chưa xử lý và mọi luật dừng đạt."
    - "NẾU CPS đo thực tế của toàn bộ noi_dia + hang_nang trong arm trợ lý, với tử số là token, tool, xem lại và làm lại thực tế của mọi attempt và mẫu số là số yêu cầu thành công, vượt 8000 đ TRONG 2 tuần đầy đủ liên tiếp ở bước 0.50 THÌ PM trợ lý hoàn phí đóng băng scope gốc, thu hẹp ca mới về noi_dia và giữ đối chứng đồng thời KHÔNG THÌ chỉ ra quyết định mở rộng scope gốc sau đủ hai tuần ở bước 0.50 và các luật khác đạt."
  interim_looks: "Cuối T+7 và T+14 chỉ rà soát an toàn/vận hành trên dữ liệu đã đủ theo dõi; không kết luận hiệu quả sớm. Chuyển bước chỉ khi không có stop rule vi phạm; chỉ số chính của cohort cuối chờ đủ 7 ngày mở lại."
  rollback: "Ba mươi phút là hạn hoàn tất thao tác tắt, không phải thời gian tự bật lại. Khách mới đi theo luồng nhân viên. Chỉ Giám đốc vận hành được bật lại sau khi Kỹ sư trưởng agent khắc phục nguyên nhân gốc, đối soát refund_ledger_write không còn hoàn trùng hoặc sai lệch liên quan, và có phê duyệt bằng văn bản. Trước pilot, Kỹ sư trưởng agent phải bổ sung khóa đơn nghiệp vụ chung, ví dụ order_id hoặc refund_target_id, vào sự kiện tạo yêu cầu và ghi sổ cái để phát hiện hoàn trùng khi request_id khác nhau; schema CP5 hiện tại chưa làm được việc này."
  decision_date: "ĐỀ XUẤT CHỜ DUYỆT: T+1 là ngày vận hành đầu tiên. T+1 đến T+7 rollout 0.10; T+8 đến T+14 rollout 0.25; T+15 đến T+28 rollout 0.50 trong 2 tuần CPS; ca cuối được phép đóng đến T+29 và theo dõi mở lại đủ 7 ngày đến hết T+36; quyết định sớm nhất T+37. Thay bằng ngày lịch khi chốt ngày bắt đầu."
  simulated_inputs:
    - "A3 CPS theo loại: noi_dia 2.696 đ; hang_nang 8.221 đ; quoc_te 22.515 đ; doi_tac 10.215 đ."
    - "A4 CPS toàn scope noi_dia + hang_nang: 3.414 đ; chi phí nhân sự nguồn là simulated."
